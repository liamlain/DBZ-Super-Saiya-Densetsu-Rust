name: Android Traditional Chinese APK

on:
  push:
    branches: [android-zh-tw]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 ndk;27.2.12479018'

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99'
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Fetch RC1 Traditional Chinese resources
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/lming888/DBZ-SSD-zhTW/24254db2d2182e697609600bd6c6dc99ec72bb36/translations/zh-tw"
          mkdir -p translations/zh-tw/fonts
          curl -fL "$BASE/zh-tw.tsv" -o translations/zh-tw/zh-tw.tsv
          curl -fL "$BASE/ui-zh-tw.tsv" -o translations/zh-tw/ui-zh-tw.tsv
          curl -fL "$BASE/fonts/LXGWWenKaiTC-Regular.ttf" -o translations/zh-tw/fonts/LXGWWenKaiTC-Regular.ttf
          curl -fL "$BASE/fonts/OFL.txt" -o translations/zh-tw/fonts/OFL.txt
          test -s translations/zh-tw/zh-tw.tsv
          test -s translations/zh-tw/ui-zh-tw.tsv
          test -s translations/zh-tw/fonts/LXGWWenKaiTC-Regular.ttf
          test -s translations/zh-tw/fonts/OFL.txt

      - name: Build ARM64 debug APK
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$ANDROID_NDK_HOME"
          export CMAKE_ANDROID="$(command -v cmake)"
          bash android/build-apk.sh arm64-v8a

      - name: Verify APK exists
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DBZ-SSD-zhTW-Android-ARM64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
